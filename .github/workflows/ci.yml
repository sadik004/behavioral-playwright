name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    name: Test & Validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies/package
        run: |
          python -m pip install --upgrade pip build ruff mypy pytest pytest-asyncio
          python -m pip install .
      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps
      - name: Install Playwright browsers (Other)
        if: runner.os != 'Linux'
        run: python -m playwright install
      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src/ tests/
      - name: Type Checking (MyPy)
        run: |
          mypy src/
      - name: Run Pytest Suite
        run: |
          pytest
      - name: Build Package (Wheel & sdist)
        run: |
          python -m build
