name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: py ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor (3.9) through current stable.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core test dependencies
        # Provider-dependent extras (pandas/numpy/curl_cffi/frida) stay
        # OPTIONAL by design: the suite must pass with the core install only.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pytest "tomli; python_version < '3.11'"
      - name: Clean interpreter import check
        run: python -c "import behavioral_playwright as bp; print(len(bp.__all__), 'public names')"
      - name: Run full test suite
        run: python -m pytest tests -q

  package:
    name: wheel build + metadata (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel installs and imports in a clean venv
        run: |
          python -m venv fresh-env
          fresh-env/bin/python -m pip install dist/*.whl
          fresh-env/bin/python -c "import behavioral_playwright as bp; import behavioral_evasion_ten_patches_hardened_v15 as impl; assert bp.BehavioralPlaywright is impl.BehavioralPlaywright; print('wheel import OK:', len(bp.__all__), 'names')"
