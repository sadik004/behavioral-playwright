name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    name: Test & Validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build ruff mypy pytest pytest-asyncio
      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check behavioral_playwright/ tests/
      - name: Type Checking (MyPy)
        run: |
          mypy behavioral_playwright/
      - name: Build Package (Wheel & sdist)
        run: |
          python -m build
      - name: Install Built Wheel
        run: |
          python -m pip install dist/*.whl
      - name: Run Pytest Suite
        run: |
          pytest
