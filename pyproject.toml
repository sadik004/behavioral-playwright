[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-playwright"
version = "1.0.0"
description = "A resilient, self-healing browser automation framework built on Playwright."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sadik", email = "author@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["behavioral_playwright*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
